<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rekordbox Explorer">
  <!-- Full circle mark: the app's hard-drive glyph inside a solid disc.
       Disc uses the dark surface colour, glyph uses --primary (hsl(200 100% 50%)).
       The thin blue ring gives the mark an edge on dark browser tabs, where a
       dark disc would otherwise disappear. -->
  <circle cx="32" cy="32" r="32" fill="#12151b"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#00AAFF" stroke-opacity="0.35" stroke-width="2"/>
  <g transform="translate(15.8 15.8) scale(1.35)"
     fill="none" stroke="#00AAFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <line x1="22" y1="12" x2="2" y2="12"/>
    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
    <line x1="6" y1="16" x2="6.01" y2="16"/>
    <line x1="10" y1="16" x2="10.01" y2="16"/>
  </g>
</svg>
