<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111317" />

    <title>Rekordbox Explorer — your rekordbox USB, in the browser</title>

      content="Browse your rekordbox USB library in the browser. Parses export.pdb locally — no uploads, no installs."

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rekordbox Explorer" />
    <meta property="og:title" content="Rekordbox Explorer" />
    <meta
      property="og:description"
      content="Browse your rekordbox USB library in the browser. Parses export.pdb locally — no uploads, no installs."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rekordbox Explorer" />

      name="twitter:description"
      content="Browse your rekordbox USB library in the browser. Parses export.pdb locally — no uploads, no installs."
    />

    <div id="root"></div>

</html>
